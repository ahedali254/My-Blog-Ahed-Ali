<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভাবনার ক্যানভাস ও কলমের ছোঁয়া - আহাদ আলী লেলিন</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #38bdf8;
            --primary-glow: #0284c7;
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 20px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 100px;
            padding-bottom: 50px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Dynamic & Fixed Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 999;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-container {
            max-width: 1250px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            transition: all 0.3s ease;
        }

        .brand-logo:hover {
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 12px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-link.active {
            color: var(--primary);
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero Header */
        .section-header {
            text-align: center;
            margin-bottom: 45px;
            margin-top: 20px;
        }

        .section-header h2 {
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-header h2 span {
            background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 400;
        }

        /* Admin Panel Styling */
        .admin-panel {
            display: none;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: var(--radius-lg);
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .admin-header h3 {
            color: var(--primary);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-admin-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .close-admin-btn:hover {
            background: #dc2626;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            background: rgba(3, 7, 18, 0.6);
            color: #ffffff;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #0284c7 100%);
            color: #030712;
            border: none;
            padding: 14px 32px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }

        /* Filter Tabs */
        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 45px;
        }

        .filter-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: #030712;
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        /* Dynamic Grid */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 32px;
        }

        /* Modern Card Item */
        .content-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(56, 189, 248, 0.3);
        }

        /* Media Header Box */
        .card-media {
            position: relative;
            width: 100%;
            height: 220px;
            background: rgba(3, 7, 18, 0.8);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .content-card:hover .card-media img {
            transform: scale(1.06);
        }

        .card-media iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .audio-wrapper {
            width: 90%;
            text-align: center;
        }

        .category-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Card Content */
        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 12px;
            font-weight: 700;
            line-height: 1.4;
        }

        .card-excerpt {
            color: var(--text-muted);
            font-size: 0.96rem;
            line-height: 1.65;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .read-more-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: gap 0.2s;
        }

        .content-card:hover .read-more-btn {
            gap: 10px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 100%;
            max-width: 720px;
            max-height: 85vh;
            border-radius: 24px;
            padding: 35px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: modalUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalUp {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .close-modal-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-main);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .modal-body-text {
            line-height: 1.85;
            color: #cbd5e1;
            font-size: 1.08rem;
            margin-top: 20px;
            white-space: pre-line;
        }

        .admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s;
            z-index: 100;
        }

        .admin-trigger:hover {
            background: var(--primary);
            color: #030712;
            border-color: var(--primary);
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.3);
        }

        .loading-text {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 50px 0;
        }

        /* Mobile Responsive Navigation */
        @media (max-width: 900px) {
            .hamburger {
                display: block;
            }

            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(3, 7, 18, 0.95);
                backdrop-filter: blur(16px);
                flex-direction: column;
                padding: 20px;
                gap: 12px;
                border-bottom: 1px solid var(--card-border);
                display: none;
            }

            .nav-menu.show {
                display: flex;
            }

            .nav-link {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 600px) {
            .portfolio-grid { grid-template-columns: 1fr; }
            .section-header h2 { font-size: 2.1rem; }
            body { padding-top: 90px; }
            .modal-content { padding: 22px; }
        }
    </style>
</head>
<body>

<!-- Dynamic Fixed Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="brand-logo">আহাদ আলী লেলিন</a>
        <button class="hamburger" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars" id="menuIcon"></i>
        </button>
        <!-- JavaScript দিয়ে মেনু ডাইনামিকালি রেন্ডার হবে -->
        <ul class="nav-menu" id="navMenu"></ul>
    </div>
</nav>

<div class="container">
    <!-- Header -->
    <div class="section-header">
        <h2><span>ভাবনার ক্যানভাস</span> ও কলমের ছোঁয়া</h2>
        <p>কবিতা, সাহিত্য, সুর এবং অনুভূতির নিভৃত সংকলন</p>
    </div>

    <!-- Admin Panel (Form) -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h3><i class="fa-solid fa-pen-to-square"></i> নতুন সৃষ্টি যুক্ত করুন</h3>
            <button class="close-admin-btn" onclick="hideAdminPanel()">লুকান</button>
        </div>
        <form id="contentForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>ক্যাটাগরি</label>
                    <select id="itemCategory" onchange="toggleFormFields()" required>
                        <option value="poem">কবিতা</option>
                        <option value="story">গল্প</option>
                        <option value="feelings">অনুভূতি</option>
                        <option value="recitation">আবৃত্তি</option>
                        <option value="audio">অডিও</option>
                        <option value="song">গান</option>
                        <option value="video">ভিডিও</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>শিরোনাম</label>
                    <input type="text" id="itemTitle" required placeholder="শিরোনাম লিখুন...">
                </div>
                <div class="form-group">
                    <label>তারিখ</label>
                    <input type="text" id="itemDate" required placeholder="যেমন: ২৫ আগস্ট, ২০২৬">
                </div>
                <div class="form-group" id="imageGroup">
                    <label>ছবি নির্বাচন (ডিভাইস থেকে)</label>
                    <input type="file" id="itemImageFile" accept="image/*">
                </div>
                <div class="form-group" id="audioGroup" style="display: none;">
                    <label>অডিও ফাইল নির্বাচন (ডিভাইস থেকে)</label>
                    <input type="file" id="itemAudioFile" accept="audio/*">
                </div>
                <div class="form-group" id="youtubeGroup" style="display: none;">
                    <label>ইউটিউব ভিডিও ID (শুধু ভিডিওর জন্য)</label>
                    <input type="text" id="itemYoutubeId" placeholder="যেমন: dQw4w9WgXcQ">
                </div>
            </div>
            <div class="form-group" id="excerptGroup">
                <label>সংক্ষিপ্ত বিবরণ (Excerpt)</label>
                <input type="text" id="itemExcerpt" placeholder="কার্ডে দেখানোর জন্য ১-২ লাইনের বিবরণ...">
            </div>
            <div class="form-group full-width" id="fullContentGroup">
                <label>সম্পূর্ণ লেখা / বিবরণ (Full Content)</label>
                <textarea id="itemFullContent" rows="5" placeholder="সম্পূর্ণ কবিতা বা লেখাটি এখানে লিখুন..."></textarea>
            </div>
            <button type="submit" class="submit-btn" id="saveBtn"><i class="fa-solid fa-cloud-arrow-up"></i> ফায়ারবেসে যুক্ত করুন</button>
        </form>
    </div>

    <!-- Category Filters -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterContent('all', this)">
            <i class="fa-solid fa-layer-group"></i> সব কন্টেন্ট
        </button>
        <button class="filter-btn" onclick="filterContent('story', this)">
            <i class="fa-solid fa-book-open"></i> গল্প
        </button>
        <button class="filter-btn" onclick="filterContent('poem', this)">
            <i class="fa-solid fa-feather-pointed"></i> কবিতা
        </button>
        <button class="filter-btn" onclick="filterContent('feelings', this)">
            <i class="fa-solid fa-heart"></i> অনুভূতি
        </button>
        <button class="filter-btn" onclick="filterContent('recitation', this)">
            <i class="fa-solid fa-microphone-lines"></i> আবৃত্তি
        </button>
        <button class="filter-btn" onclick="filterContent('audio', this)">
            <i class="fa-solid fa-file-audio"></i> অডিও
        </button>
        <button class="filter-btn" onclick="filterContent('song', this)">
            <i class="fa-solid fa-music"></i> গান
        </button>
        <button class="filter-btn" onclick="filterContent('video', this)">
            <i class="fa-solid fa-video"></i> ভিডিও
        </button>
    </div>

    <!-- Portfolio Dynamic Grid -->
    <div class="portfolio-grid" id="portfolioGrid">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ডাটা লোড হচ্ছে...</div>
    </div>
</div>

<!-- Detailed Modal View -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-modal-btn" onclick="closeModal()">✕</button>
        <span class="category-badge" id="modalBadge" style="position: relative; top: 0; left: 0; display: inline-block; margin-bottom: 12px;"></span>
        <h2 id="modalTitle" style="font-size: 1.9rem; color: #f8fafc;"></h2>
        <div id="modalDate" style="color: #94a3b8; font-size: 0.95rem; margin-top: 6px;"></div>
        <hr style="margin: 18px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
        <div class="modal-body-text" id="modalBody"></div>
    </div>
</div>

<button class="admin-trigger" onclick="showAdminPanel()"><i class="fa-solid fa-lock"></i> Admin Login</button>

<!-- Dynamic Navigation Script -->
<script>
    // ১. ডায়নামিক মেনু বার রেন্ডার করার লজিক
    const pages = [
        { name: "হোম", url: "index.html" },
        { name: "সংগ্রহ", url: "literature.html" },
        { name: "আমার লেখা", url: "thoughts.html" },
        { name: "স্মৃতির পাতায়", url: "galary.html" },
        { name: "আমার সম্পর্কে", url: "about.html" },
        { name: "যোগাযোগ", url: "contact.html" }
    ];

    function renderDynamicNavbar() {
        const navMenu = document.getElementById("navMenu");
        if (!navMenu) return;

        // বর্তমান পেজের ইউআরএল চেক করা (ডিফল্ট: index.html)
        const currentPage = window.location.pathname.split("/").pop() || "index.html";

        const menuHTML = pages.map(page => {
            const isActive = (currentPage === page.url) ? 'active' : '';
            return `
                <li>
                    <a href="${page.url}" class="nav-link ${isActive}">${page.name}</a>
                </li>
            `;
        }).join('');

        navMenu.innerHTML = menuHTML;
    }

    function toggleMobileMenu() {
        const menu = document.getElementById("navMenu");
        const icon = document.getElementById("menuIcon");
        menu.classList.toggle("show");
        
        if (menu.classList.contains("show")) {
            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");
        } else {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        }
    }

    document.addEventListener("DOMContentLoaded", renderDynamicNavbar);
</script>

<!-- Firebase SDK Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCUFnabuAwrDzdLKmuJdu8L3Ix-6RtmFYw",
        authDomain: "my-favorite-afd36.firebaseapp.com",
        projectId: "my-favorite-afd36",
        storageBucket: "my-favorite-afd36.firebasestorage.app",
        messagingSenderId: "946815901030",
        appId: "1:946815901030:web:b36846c356f8f97edbfca7",
        measurementId: "G-7N5GJ6X4KS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "Laboni"; 
    let allContentItems = [];

    const categoryMap = {
        'poem': 'কবিতা',
        'story': 'গল্প',
        'feelings': 'অনুভূতি',
        'recitation': 'আবৃত্তি',
        'audio': 'অডিও',
        'song': 'গান',
        'video': 'ভিডিও'
    };

    window.toggleFormFields = function() {
        const cat = document.getElementById("itemCategory").value;
        const isAudioType = ['audio', 'recitation', 'song'].includes(cat);
        const isVideo = cat === 'video';

        document.getElementById("audioGroup").style.display = isAudioType ? "block" : "none";
        document.getElementById("youtubeGroup").style.display = isVideo ? "block" : "none";
        document.getElementById("imageGroup").style.display = (isAudioType || isVideo) ? "none" : "block";

        document.getElementById("excerptGroup").style.display = isAudioType ? "none" : "block";
        document.getElementById("fullContentGroup").style.display = isAudioType ? "none" : "block";
    };

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    const scaleSize = maxWidth / img.width;
                    
                    if (scaleSize < 1) {
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    function readFileAsBase64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }

    async function fetchCanvasPosts() {
        const grid = document.getElementById('portfolioGrid');
        grid.innerHTML = '<div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ডাটা লোড হচ্ছে...</div>';

        try {
            const querySnapshot = await getDocs(collection(db, "canvas_posts"));
            allContentItems = [];
            querySnapshot.forEach((doc) => {
                allContentItems.push(doc.data());
            });
            allContentItems.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            renderCards(allContentItems);
        } catch (error) {
            console.error("Error fetching data: ", error);
            grid.innerHTML = '<div class="loading-text">ডাটা লোড করতে সমস্যা হয়েছে।</div>';
        }
    }

    document.getElementById("contentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("saveBtn");
        saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> সেভ হচ্ছে...';
        saveBtn.disabled = true;

        const catKey = document.getElementById("itemCategory").value;
        const isAudioType = ['audio', 'recitation', 'song'].includes(catKey);

        let imageBase64 = "https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=600&q=80";
        let audioBase64 = "";

        const imageFile = document.getElementById("itemImageFile").files[0];
        if (imageFile && !isAudioType) {
            imageBase64 = await compressImage(imageFile);
        }

        const audioFile = document.getElementById("itemAudioFile").files[0];
        if (audioFile && isAudioType) {
            audioBase64 = await readFileAsBase64(audioFile);
        }

        const newPost = {
            category: catKey,
            categoryName: categoryMap[catKey],
            title: document.getElementById("itemTitle").value,
            date: document.getElementById("itemDate").value,
            image: imageBase64,
            audio: audioBase64,
            youtubeId: document.getElementById("itemYoutubeId").value.trim(),
            excerpt: isAudioType ? "" : document.getElementById("itemExcerpt").value,
            fullContent: isAudioType ? "" : document.getElementById("itemFullContent").value,
            createdAt: new Date().getTime()
        };

        try {
            await addDoc(collection(db, "canvas_posts"), newPost);
            alert("নতুন কন্টেন্ট সফলভাবে ফায়ারবেসে যুক্ত হয়েছে!");
            document.getElementById("contentForm").reset();
            toggleFormFields();
            fetchCanvasPosts();
        } catch (error) {
            alert("ভুল হয়েছে: " + error.message);
        } finally {
            saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> ফায়ারবেসে যুক্ত করুন';
            saveBtn.disabled = false;
        }
    });

    window.renderCards = function(items) {
        const grid = document.getElementById('portfolioGrid');
        grid.innerHTML = '';

        if (items.length === 0) {
            grid.innerHTML = '<div class="loading-text">কোনো কন্টেন্ট পাওয়া যায়নি।</div>';
            return;
        }

        items.forEach(item => {
            const isAudio = ['audio', 'recitation', 'song'].includes(item.category);
            let mediaHTML = '';
            
            if (item.youtubeId) {
                mediaHTML = `<iframe src="https://www.youtube.com/embed/${item.youtubeId}" allowfullscreen></iframe>`;
            } else if (isAudio || item.audio) {
                mediaHTML = `
                    <div class="audio-wrapper">
                        <i class="fa-solid fa-microphone-lines fa-2x" style="color: #38bdf8; margin-bottom: 12px;"></i>
                        <audio controls style="width: 100%;">
                            <source src="${item.audio}" type="audio/mpeg">
                            আপনার ব্রাউজার অডিও সাপোর্ট করে না।
                        </audio>
                    </div>`;
            } else {
                mediaHTML = `<img src="${item.image}" alt="${item.title}">`;
            }

            const card = document.createElement('div');
            card.className = 'content-card';
            
            if (!isAudio) {
                card.style.cursor = 'pointer';
                card.onclick = () => openModal(item);
            }

            card.innerHTML = `
                <div class="card-media">
                    <span class="category-badge">${item.categoryName}</span>
                    ${mediaHTML}
                </div>
                <div class="card-body">
                    <h3 class="card-title">${item.title}</h3>
                    ${!isAudio ? `<p class="card-excerpt">${item.excerpt || ''}</p>` : ''}
                    <div class="card-footer" style="margin-top: auto;">
                        <span><i class="fa-regular fa-calendar"></i> ${item.date}</span>
                        ${!isAudio ? `<span class="read-more-btn">পড়ুন / দেখুন <i class="fa-solid fa-arrow-right"></i></span>` : ''}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    };

    window.filterContent = function(category, btnElement) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        if (category === 'all') {
            renderCards(allContentItems);
        } else {
            const filtered = allContentItems.filter(item => item.category === category);
            renderCards(filtered);
        }
    };

    window.showAdminPanel = function() {
        const pass = prompt("অ্যাডমিন পাসওয়ার্ড প্রবেশ করান:");
        if (pass && pass.trim() === ADMIN_PASSWORD) {
            document.getElementById("adminPanel").style.display = "block";
            toggleFormFields();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (pass !== null) {
            alert("ভুল পাসওয়ার্ড!");
        }
    };

    window.hideAdminPanel = function() {
        document.getElementById("adminPanel").style.display = "none";
    };

    window.openModal = function(item) {
        document.getElementById("modalBadge").innerText = item.categoryName;
        document.getElementById("modalTitle").innerText = item.title;
        document.getElementById("modalDate").innerHTML = `<i class="fa-regular fa-calendar"></i> ${item.date}`;
        document.getElementById("modalBody").innerText = item.fullContent || 'কোন বিবরণ পাওয়া যায়নি।';
        document.getElementById("modalOverlay").style.display = "flex";
    };

    window.closeModal = function() {
        document.getElementById("modalOverlay").style.display = "none";
    };

    fetchCanvasPosts();
</script>

</body>
</html>
