<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার পছন্দের সংগ্রহ</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        
        body { 
            background-color: #0b1329; 
            color: #f8fafc; 
            padding-top: 80px;
            padding-bottom: 30px; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Fixed Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(18, 28, 56, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #f8fafc;
            cursor: pointer;
        }

        /* Background Canvas Particle */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }
        
        header { text-align: center; margin-bottom: 35px; margin-top: 15px; }
        header h1 { 
            color: #38bdf8; 
            margin-bottom: 8px; 
            font-size: 2.4rem; 
            font-weight: 700;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        header p { color: #94a3b8; font-size: 1.05rem; }

        /* Admin Panel Modern Styling */
        .admin-panel {
            display: none;
            background: rgba(18, 28, 56, 0.85);
            backdrop-filter: blur(16px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; }
        .admin-header h3 { color: #38bdf8; font-size: 1.2rem; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #dc2626; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; background: rgba(11, 19, 41, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 0.95rem; color: #f8fafc; outline: none; transition: 0.3s;
        }
        .form-group select option { background: #0b1329; color: #fff; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        
        .submit-btn { 
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); 
            color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; 
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4); transition: all 0.3s ease;
        }
        .submit-btn:hover { box-shadow: 0 0 25px rgba(56, 189, 248, 0.8); transform: translateY(-2px); }
        .submit-btn:disabled { background: #64748b; cursor: not-allowed; box-shadow: none; }

        /* Filter Buttons */
        .filter-buttons { display: flex; justify-content: center; gap: 12px; margin-bottom: 35px; flex-wrap: wrap; }
        .filter-btn { 
            background: rgba(18, 28, 56, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 22px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #94a3b8; transition: all 0.3s ease; backdrop-filter: blur(8px);
        }
        .filter-btn:hover, .filter-btn.active { 
            background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* Grid Cards Area */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
        .card { 
            background: rgba(18, 28, 56, 0.6); backdrop-filter: blur(12px); border-radius: 18px; padding: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        
        .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .modal-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }

        /* Glowing Badges */
        .badge { align-self: flex-start; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; border: 1px solid transparent; }
        .badge-নাটক { background: rgba(225, 29, 72, 0.15); color: #fb7185; border-color: rgba(225, 29, 72, 0.3); }
        .badge-উপন্যাস { background: rgba(37, 99, 235, 0.15); color: #60a5fa; border-color: rgba(37, 99, 235, 0.3); }
        .badge-গল্প { background: rgba(22, 163, 74, 0.15); color: #4ade80; border-color: rgba(22, 163, 74, 0.3); }
        .badge-কবিতা { background: rgba(217, 119, 6, 0.15); color: #fbbf24; border-color: rgba(217, 119, 6, 0.3); }

        .card h3 { color: #f8fafc; margin-bottom: 6px; font-size: 1.2rem; font-weight: 700; }
        .author { color: #38bdf8; font-size: 0.88rem; margin-bottom: 12px; }
        .description { color: #cbd5e1; font-size: 0.9rem; line-height: 1.6; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .read-more { margin-top: auto; color: #38bdf8; font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; gap: 5px; }

        /* Modal Popup Styling */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 19, 41, 0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal-content { background: #121c38; width: 100%; max-width: 650px; max-height: 85vh; border-radius: 20px; padding: 30px; overflow-y: auto; position: relative; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); color: #f8fafc; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.08); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1rem; transition: 0.3s; }
        .close-btn:hover { background: rgba(239, 68, 68, 0.8); }

        .admin-trigger { position: fixed; bottom: 15px; right: 15px; background: rgba(18, 28, 56, 0.8); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; backdrop-filter: blur(8px); transition: 0.3s; z-index: 99; }
        .admin-trigger:hover { color: #38bdf8; border-color: #38bdf8; }
        .loading-text { text-align: center; font-size: 1.1rem; color: #94a3b8; grid-column: 1 / -1; padding: 40px 0; }

        /* Mobile Device Responsive Styles */
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(18, 28, 56, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 20px;
                gap: 16px;
                border-bottom: 1px solid rgba(56, 189, 248, 0.2);
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
                display: none;
            }
            .nav-menu.show { display: flex; }
        }
    </style>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<!-- Fixed Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="brand-logo">
            <i class="fa-solid fa-bookmark"></i> পছন্দের সংগ্রহ
        </a>
        <button class="hamburger" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars" id="menuIcon"></i>
        </button>
        <!-- Dynamic Navigation Array will load here -->
        <ul class="nav-menu" id="navMenu"></ul>
    </div>
</nav>

<canvas id="particle-canvas"></canvas>

<div class="container">
    <header>
        <h1>আমার পছন্দের সংগ্রহ</h1>
        <p>আমার প্রিয় নাটক, উপন্যাস, গল্প ও কবিতা</p>
    </header>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h3>নতুন লেখা যুক্ত করুন (অ্যাডমিন প্যানেল)</h3>
            <button class="logout-btn" onclick="hideAdminPanel()">লুকান</button>
        </div>
        <form id="itemForm">
            <div class="form-group">
                <label>ক্যাটাগরি</label>
                <select id="itemType" required>
                    <option value="কবিতা">কবিতা</option>
                    <option value="গল্প">গল্প</option>
                    <option value="উপন্যাস">উপন্যাস</option>
                    <option value="নাটক">নাটক</option>
                </select>
            </div>
            <div class="form-group">
                <label>শিরোনাম</label>
                <input type="text" id="itemTitle" required placeholder="যেমন: পাছে লোকে কিছু বলে">
            </div>
            <div class="form-group">
                <label>লেখক</label>
                <input type="text" id="itemAuthor" required placeholder="যেমন: কামিনী রায়">
            </div>
            <div class="form-group">
                <label>ছবির লিঙ্ক / Image URL (অপশনাল)</label>
                <input type="url" id="itemImageUrl" placeholder="https://example.com/image.jpg (খালি রাখলেও চলবে)">
            </div>
            <div class="form-group">
                <label>ছোট বিবরণ (সংক্ষেপে)</label>
                <input type="text" id="itemDesc" required placeholder="সংক্ষিপ্ত বিবরণ...">
            </div>
            <div class="form-group">
                <label>সম্পূর্ণ লেখা (বিস্তারিত)</label>
                <textarea id="itemFullContent" rows="6" required placeholder="সম্পূর্ণ কবিতা বা গল্প লিখুন..."></textarea>
            </div>
            <button type="submit" class="submit-btn" id="saveBtn">Save / সেভ করুন</button>
        </form>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterSelection('সব', this)">সবগুলো</button>
        <button class="filter-btn" onclick="filterSelection('নাটক', this)">নাটক</button>
        <button class="filter-btn" onclick="filterSelection('উপন্যাস', this)">উপন্যাস</button>
        <button class="filter-btn" onclick="filterSelection('গল্প', this)">গল্প</button>
        <button class="filter-btn" onclick="filterSelection('কবিতা', this)">কবিতা</button>
    </div>

    <div class="grid-container" id="contentGrid">
        <div class="loading-text">ডাটা লোড হচ্ছে...</div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div id="modalImageContainer"></div>
        <span class="badge" id="modalBadge"></span>
        <h2 id="modalTitle" style="margin-top: 10px; color: #38bdf8;"></h2>
        <div class="author" id="modalAuthor" style="margin-top: 5px;"></div>
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
        <div class="modal-body" id="modalBody" style="line-height: 1.8; color: #cbd5e1;"></div>
    </div>
</div>

<button class="admin-trigger" onclick="showAdminPanel()"><i class="fa-solid fa-lock"></i> Admin Login</button>

<script>
    // ১. ডায়নামিক মেনু বার রেন্ডার করার লজিক (Dynamic Navigation)
    const pages = [
        { name: "হোম", url: "index.html" },
        { name: "সংগ্রহ", url: "literature.html" },
        { name: "আমার লেখা", url: "thoughts.html" },
        { name: "স্মৃতির পাতায়", url: "galary.html" },
        { name: "আমার সম্পর্কে", url: "about.html" },
        { name: "যোগাযোগ", url: "contact.html" }
    ];

    function renderDynamicMenu() {
        const navMenu = document.getElementById("navMenu");
        if (!navMenu) return;

        const currentPath = window.location.pathname.split("/").pop() || "index.html";

        const menuHTML = pages.map(page => {
            const isActive = (currentPath === page.url || (currentPath === '' && page.url === 'index.html')) ? "active" : "";
            return `<li><a href="${page.url}" class="nav-link ${isActive}">${page.name}</a></li>`;
        }).join('');

        navMenu.innerHTML = menuHTML + `<li><a href="javascript:void(0)" onclick="showAdminPanel()" class="nav-link"><i class="fa-solid fa-lock"></i> অ্যাডমিন</a></li>`;
    }

    document.addEventListener("DOMContentLoaded", renderDynamicMenu);

    // Navigation Toggle for Mobile
    function toggleMobileMenu() {
        var menu = document.getElementById("navMenu");
        var icon = document.getElementById("menuIcon");
        menu.classList.toggle("show");
        
        if (menu.classList.contains("show")) {
            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");
        } else {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        }
    }

    // Canvas Particle Animation
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    for (let i = 0; i < 40; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            dx: (Math.random() - 0.5) * 0.5,
            dy: (Math.random() - 0.5) * 0.5
        });
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
        
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            p.x += p.dx;
            p.y += p.dy;

            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Firebase Configurations
    var firebaseConfig = {
        apiKey: "AIzaSyCUFnabuAwrDzdLKmuJdu8L3Ix-6RtmFYw",
        authDomain: "my-favorite-afd36.firebaseapp.com",
        projectId: "my-favorite-afd36",
        storageBucket: "my-favorite-afd36.firebasestorage.app",
        messagingSenderId: "946815901030",
        appId: "1:946815901030:web:b36846c356f8f97edbfca7"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.firestore();

    var ADMIN_PASSWORD = "4858"; 
    var allData = [];

    function fetchPosts() {
        var grid = document.getElementById("contentGrid");
        grid.innerHTML = '<div class="loading-text">ডাটা লোড হচ্ছে...</div>';
        
        db.collection("collection").orderBy("createdAt", "desc").get().then(function(querySnapshot) {
            allData = [];
            querySnapshot.forEach(function(doc) {
                var d = doc.data();
                d.id = doc.id;
                allData.push(d);
            });
            displayContent(allData);
        }).catch(function(error) {
            console.error("Error loading docs: ", error);
            grid.innerHTML = '<div class="loading-text">ডাটা লোড করতে সমস্যা হয়েছে: ' + error.message + '</div>';
        });
    }

    document.getElementById("itemForm").addEventListener("submit", function(e) {
        e.preventDefault();
        var saveBtn = document.getElementById("saveBtn");
        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;

        var imageUrl = document.getElementById("itemImageUrl").value.trim();

        db.collection("collection").add({
            type: document.getElementById("itemType").value,
            title: document.getElementById("itemTitle").value,
            author: document.getElementById("itemAuthor").value,
            description: document.getElementById("itemDesc").value,
            fullContent: document.getElementById("itemFullContent").value,
            imageUrl: imageUrl,
            createdAt: new Date().getTime()
        }).then(function() {
            alert("সফলভাবে যুক্ত হয়েছে!");
            document.getElementById("itemForm").reset();
            fetchPosts();
        }).catch(function(error) {
            alert("Error: " + error.message);
        }).finally(function() {
            saveBtn.innerText = "Save / সেভ করুন";
            saveBtn.disabled = false;
        });
    });

    function displayContent(items) {
        var grid = document.getElementById("contentGrid");
        grid.innerHTML = "";

        if(!items || items.length === 0) {
            grid.innerHTML = '<div class="loading-text">কোনো তথ্য নেই। অ্যাডমিন থেকে নতুন লেখা যুক্ত করুন।</div>';
            return;
        }

        items.forEach(function(item) {
            var card = document.createElement("div");
            card.className = "card";
            card.onclick = function() { openModal(item); };
            
            var imgHTML = (item.imageUrl && item.imageUrl !== "") 
                ? '<img src="' + item.imageUrl + '" class="card-img">' 
                : '';

            card.innerHTML = imgHTML +
                '<span class="badge badge-' + (item.type || 'কবিতা') + '">' + (item.type || 'কবিতা') + '</span>' +
                '<h3>' + (item.title || '') + '</h3>' +
                '<div class="author">লেখক: ' + (item.author || 'অজানা') + '</div>' +
                '<div class="description">' + (item.description || '') + '</div>' +
                '<div class="read-more">বিস্তারিত পড়ুন →</div>';
            
            grid.appendChild(card);
        });
    }

    function filterSelection(category, btnElement) {
        document.querySelectorAll('.filter-btn').forEach(function(btn) { btn.classList.remove('active'); });
        btnElement.classList.add('active');
        if (category === 'সব') displayContent(allData);
        else displayContent(allData.filter(function(item) { return item.type === category; }));
    }

    function showAdminPanel() {
        var pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
        if (pass === ADMIN_PASSWORD) {
            document.getElementById("adminPanel").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (pass !== null) {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function hideAdminPanel() {
        document.getElementById("adminPanel").style.display = "none";
    }

    function openModal(item) {
        document.getElementById("modalTitle").innerText = item.title || '';
        document.getElementById("modalAuthor").innerText = "লেখক: " + (item.author || 'অজানা');
        
        var fullContentText = item.fullContent ? item.fullContent.replace(/\n/g, "<br>") : '';
        document.getElementById("modalBody").innerHTML = fullContentText;
        
        var imgContainer = document.getElementById("modalImageContainer");
        if(item.imageUrl && item.imageUrl !== "") {
            imgContainer.innerHTML = '<img src="' + item.imageUrl + '" class="modal-img">';
        } else {
            imgContainer.innerHTML = '';
        }

        var badge = document.getElementById("modalBadge");
        badge.innerText = item.type || 'কবিতা';
        badge.className = 'badge badge-' + (item.type || 'কবিতা');
        document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modalOverlay").style.display = "none";
    }

    // Initial Load
    fetchPosts();
</script>
</body>
</html>
