<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মৃতির পাতায় - ছবি গ্যালারি</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #f8fafc;
            padding-top: 80px;
            padding-bottom: 50px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Fixed Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(18, 28, 56, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #f8fafc;
            cursor: pointer;
        }

        /* Background Canvas Particle */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 35px;
            margin-top: 15px;
        }

        header h1 {
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 2.4rem;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        header p {
            color: #94a3b8;
            font-size: 1.05rem;
        }

        /* Admin Panel Modern Styling */
        .admin-panel {
            display: none;
            background: rgba(18, 28, 56, 0.85);
            backdrop-filter: blur(16px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(56, 189, 248, 0.3);
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
        }

        .admin-header h3 {
            color: #38bdf8;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(11, 19, 41, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.95rem;
            color: #f8fafc;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .submit-btn {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px);
        }

        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 12px;
            display: none;
            border-radius: 10px;
            border: 1px dashed rgba(56, 189, 248, 0.4);
            background: rgba(11, 19, 41, 0.5);
            padding: 8px;
        }

        /* Gallery Grid Area */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .gallery-card {
            background: rgba(18, 28, 56, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .gallery-card-media {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: rgba(11, 19, 41, 0.8);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.06);
        }

        .gallery-card .caption {
            padding: 16px;
            font-size: 0.95rem;
            color: #f8fafc;
            text-align: center;
            font-weight: 500;
            line-height: 1.4;
            background: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 41, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 850px;
            width: 100%;
            max-height: 85vh;
            text-align: center;
            position: relative;
            background: #121c38;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 12px;
            object-fit: contain;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-caption {
            color: #38bdf8;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 1rem;
            transition: 0.3s;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.8);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(18, 28, 56, 0.8);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            width: 44px;
            height: 44px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #38bdf8;
            color: #0b1329;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .prev-btn { left: -20px; }
        .next-btn { right: -20px; }

        .admin-trigger {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(18, 28, 56, 0.8);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            backdrop-filter: blur(8px);
            transition: 0.3s;
            z-index: 99;
        }

        .admin-trigger:hover {
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .loading-text {
            text-align: center;
            font-size: 1.1rem;
            color: #94a3b8;
            grid-column: 1 / -1;
            padding: 50px 0;
        }

        /* Mobile Device Responsive Styles */
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(18, 28, 56, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 20px;
                gap: 16px;
                border-bottom: 1px solid rgba(56, 189, 248, 0.2);
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
                display: none;
            }
            .nav-menu.show { display: flex; }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
        }
    </style>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="brand-logo">
            <i class="fa-solid fa-images"></i> স্মৃতির পাতায়
        </a>
        <button class="hamburger" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars" id="menuIcon"></i>
        </button>
        <!-- Dynamic Navigation Menu -->
        <ul class="nav-menu" id="navMenu"></ul>
    </div>
</nav>

<canvas id="particle-canvas"></canvas>

<div class="container">
    <header>
        <h1>স্মৃতির পাতায়</h1>
        <p>আমার সুন্দর মুহূর্ত ও স্মৃতির ডিজিটাল সংগ্রহ</p>
    </header>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h3><i class="fa-solid fa-cloud-arrow-up"></i> নতুন ছবি আপলোড করুন</h3>
            <button class="logout-btn" onclick="hideAdminPanel()">লুকান</button>
        </div>
        <form id="photoForm">
            <div class="form-group">
                <label>ফোন বা কম্পিউটার থেকে ছবি সিলেক্ট করুন</label>
                <input type="file" id="fileInput" accept="image/*" required onchange="processAndPreviewFile()">
                <img id="imgPreview" class="image-preview" alt="Preview">
            </div>
            <div class="form-group">
                <label>ছবির বিবরণ/ক্যাপশন</label>
                <input type="text" id="photoCaption" required placeholder="ছবি সম্পর্কে সংক্ষেপে লিখুন...">
            </div>
            <button type="submit" class="submit-btn" id="saveBtn"><i class="fa-solid fa-upload"></i> সেভ ও আপলোড করুন</button>
        </form>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ছবি লোড হচ্ছে...</div>
    </div>
</div>

<!-- Image Lightbox Modal -->
<div class="modal" id="imageModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">✕</span>
        <button class="nav-btn prev-btn" onclick="changeSlide(-1)">❮</button>
        <img id="modalImg" src="" alt="Expanded View">
        <div class="modal-caption" id="modalCaption"></div>
        <button class="nav-btn next-btn" onclick="changeSlide(1)">❯</button>
    </div>
</div>

<button class="admin-trigger" onclick="showAdminPanel()"><i class="fa-solid fa-lock"></i> Admin Login</button>

<script>
    // ১. ডায়নামিক মেনু বার রেন্ডার করার লজিক (Dynamic Navigation)
    const pages = [
        { name: "হোম", url: "index.html" },
        { name: "সংগ্রহ", url: "literature.html" },
        { name: "আমার লেখা", url: "thoughts.html" },
        { name: "স্মৃতির পাতায়", url: "galary.html" },
        { name: "আমার সম্পর্কে", url: "about.html" },
        { name: "যোগাযোগ", url: "contact.html" }
    ];

    function renderDynamicMenu() {
        const navMenu = document.getElementById("navMenu");
        if (!navMenu) return;

        const currentPath = window.location.pathname.split("/").pop() || "galary.html";

        const menuHTML = pages.map(page => {
            const isActive = (currentPath === page.url) ? "active" : "";
            return `<li><a href="${page.url}" class="nav-link ${isActive}">${page.name}</a></li>`;
        }).join('');

        navMenu.innerHTML = menuHTML + `<li><a href="javascript:void(0)" onclick="showAdminPanel()" class="nav-link"><i class="fa-solid fa-lock"></i> অ্যাডমিন</a></li>`;
    }

    document.addEventListener("DOMContentLoaded", renderDynamicMenu);

    // Navigation Toggle for Mobile
    function toggleMobileMenu() {
        var menu = document.getElementById("navMenu");
        var icon = document.getElementById("menuIcon");
        menu.classList.toggle("show");
        
        if (menu.classList.contains("show")) {
            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");
        } else {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        }
    }

    // Canvas Particle Animation
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    for (let i = 0; i < 40; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            dx: (Math.random() - 0.5) * 0.5,
            dy: (Math.random() - 0.5) * 0.5
        });
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
        
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            p.x += p.dx;
            p.y += p.dy;

            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Firebase Integration
    var firebaseConfig = {
        apiKey: "AIzaSyCUFnabuAwrDzdLKmuJdu8L3Ix-6RtmFYw",
        authDomain: "my-favorite-afd36.firebaseapp.com",
        projectId: "my-favorite-afd36",
        storageBucket: "my-favorite-afd36.firebasestorage.app",
        messagingSenderId: "946815901030",
        appId: "1:946815901030:web:b36846c356f8f97edbfca7"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.firestore();

    var ADMIN_PASSWORD = "4858"; 
    var galleryData = [];
    var currentIndex = 0;
    var compressedBase64Image = "";

    // Image Compression Helper
    function processAndPreviewFile() {
        var file = document.getElementById('fileInput').files[0];
        var preview = document.getElementById('imgPreview');
        
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function (e) {
            var img = new Image();
            img.onload = function () {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');

                var maxWidth = 800;
                var scaleSize = maxWidth / img.width;
                
                if (scaleSize < 1) {
                    canvas.width = maxWidth;
                    canvas.height = img.height * scaleSize;
                } else {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                compressedBase64Image = canvas.toDataURL('image/jpeg', 0.7);
                
                preview.src = compressedBase64Image;
                preview.style.display = "block";
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Fetch Photos from Firestore
    function fetchPhotos() {
        var grid = document.getElementById("galleryGrid");
        grid.innerHTML = '<div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ছবি লোড হচ্ছে...</div>';
        
        db.collection("gallery").orderBy("createdAt", "desc").get().then(function(querySnapshot) {
            galleryData = [];
            querySnapshot.forEach(function(doc) {
                galleryData.push(doc.data());
            });
            displayGallery(galleryData);
        }).catch(function(error) {
            console.error("Error loading photos: ", error);
            grid.innerHTML = '<div class="loading-text">ছবি লোড করতে সমস্যা হয়েছে!</div>';
        });
    }

    // Upload Form Submit
    document.getElementById("photoForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        if (!compressedBase64Image) {
            alert("দয়া করে একটি ছবি সিলেক্ট করুন!");
            return;
        }

        var saveBtn = document.getElementById("saveBtn");
        saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> আপলোড হচ্ছে...';
        saveBtn.disabled = true;

        db.collection("gallery").add({
            url: compressedBase64Image,
            caption: document.getElementById("photoCaption").value.trim(),
            createdAt: new Date().getTime()
        }).then(function() {
            alert("ছবি সফলভাবে আপলোড হয়েছে!");
            document.getElementById("photoForm").reset();
            document.getElementById("imgPreview").style.display = "none";
            compressedBase64Image = "";
            fetchPhotos();
        }).catch(function(error) {
            alert("Error: " + error.message);
        }).finally(function() {
            saveBtn.innerHTML = '<i class="fa-solid fa-upload"></i> সেভ ও আপলোড করুন';
            saveBtn.disabled = false;
        });
    });

    // Display Gallery
    function displayGallery(items) {
        var grid = document.getElementById("galleryGrid");
        grid.innerHTML = "";

        if(!items || items.length === 0) {
            grid.innerHTML = '<div class="loading-text">গ্যালারিতে কোনো ছবি নেই। অ্যাডমিন থেকে ছবি যুক্ত করুন।</div>';
            return;
        }

        items.forEach(function(item, index) {
            var card = document.createElement("div");
            card.className = "gallery-card";
            card.onclick = function() { openModal(index); };
            
            card.innerHTML = '<div class="gallery-card-media"><img src="' + item.url + '" alt="Gallery Image"></div>' +
                            '<div class="caption">' + item.caption + '</div>';
            
            grid.appendChild(card);
        });
    }

    // Lightbox Controls
    function openModal(index) {
        currentIndex = index;
        updateModalContent();
        document.getElementById("imageModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("imageModal").style.display = "none";
    }

    function changeSlide(direction) {
        currentIndex += direction;
        if (currentIndex < 0) {
            currentIndex = galleryData.length - 1;
        } else if (currentIndex >= galleryData.length) {
            currentIndex = 0;
        }
        updateModalContent();
    }

    function updateModalContent() {
        var item = galleryData[currentIndex];
        document.getElementById("modalImg").src = item.url;
        document.getElementById("modalCaption").innerText = item.caption;
    }

    // Admin Controls
    function showAdminPanel() {
        var pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
        if (pass === ADMIN_PASSWORD) {
            document.getElementById("adminPanel").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (pass !== null) {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function hideAdminPanel() {
        document.getElementById("adminPanel").style.display = "none";
    }

    // Initial Load
    fetchPhotos();
</script>
</body>
</html>
