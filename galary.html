<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ছবি গ্যালারি</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 80px;
            padding-bottom: 50px;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Responsive Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 999;
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.98rem;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero Header */
        .section-header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        .section-header h1 {
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-header h1 span {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 400;
        }

        /* Admin Panel Styling */
        .admin-panel {
            display: none;
            background: #ffffff;
            padding: 30px;
            border-radius: var(--radius-lg);
            margin-bottom: 40px;
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(37, 99, 235, 0.2);
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .admin-header h3 {
            color: var(--primary);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 12px;
            display: none;
            border-radius: var(--radius-md);
            border: 2px dashed var(--border-color);
            background: #f8fafc;
            padding: 8px;
        }

        /* Dynamic Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .gallery-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gallery-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .gallery-card-media {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #f1f5f9;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.06);
        }

        .gallery-card .caption {
            padding: 16px;
            font-size: 0.98rem;
            color: var(--text-main);
            text-align: center;
            font-weight: 500;
            line-height: 1.4;
            background: var(--card-bg);
            border-top: 1px solid #f1f5f9;
        }

        /* Modal Overlay & Carousel Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            text-align: center;
            position: relative;
            animation: modalUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .modal-caption {
            color: #ffffff;
            margin-top: 18px;
            font-size: 1.15rem;
            font-weight: 500;
        }

        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: white;
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn { left: -60px; }
        .next-btn { right: -60px; }

        .admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ffffff;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s;
            z-index: 100;
        }

        .admin-trigger:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }

        .loading-text {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 50px 0;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: #ffffff;
                flex-direction: column;
                padding: 20px;
                gap: 16px;
                box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
                border-bottom: 1px solid var(--border-color);
                display: none;
            }
            .nav-menu.show { display: flex; }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
        }

        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .section-header h1 { font-size: 2.1rem; }
            body { padding-top: 70px; }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<!-- Responsive Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="#" class="brand-logo">
            <i class="fa-solid fa-images"></i> ছবি গ্যালারি
        </a>
        <button class="hamburger" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars" id="menuIcon"></i>
        </button>
        <ul class="nav-menu" id="navMenu">
            <li><a href="#" class="nav-link active">হোম</a></li>
            <li><a href="#galleryGrid" class="nav-link">গ্যালারি</a></li>
            <li><a href="javascript:void(0)" onclick="showAdminPanel()" class="nav-link"><i class="fa-solid fa-lock"></i> অ্যাডমিন</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <!-- Header -->
    <div class="section-header">
        <h1><span>আমার ছবি</span> গ্যালারি</h1>
        <p>আমার সুন্দর মুহূর্ত ও স্মৃতির ডিজিটাল সংগ্রহ</p>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h3><i class="fa-solid fa-cloud-arrow-up"></i> নতুন ছবি আপলোড করুন</h3>
            <button class="logout-btn" onclick="hideAdminPanel()">লুকান</button>
        </div>
        <form id="photoForm">
            <div class="form-group">
                <label>ফোন বা কম্পিউটার থেকে ছবি সিলেক্ট করুন</label>
                <input type="file" id="fileInput" accept="image/*" required onchange="processAndPreviewFile()">
                <img id="imgPreview" class="image-preview" alt="Preview">
            </div>
            <div class="form-group">
                <label>ছবির বিবরণ/ক্যাপশন</label>
                <input type="text" id="photoCaption" required placeholder="ছবি সম্পর্কে সংক্ষেপে লিখুন...">
            </div>
            <button type="submit" class="submit-btn" id="saveBtn"><i class="fa-solid fa-upload"></i> সেভ ও আপলোড করুন</button>
        </form>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ছবি লোড হচ্ছে...</div>
    </div>
</div>

<!-- Image Lightbox Modal -->
<div class="modal" id="imageModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">✕</span>
        <button class="nav-btn prev-btn" onclick="changeSlide(-1)">❮</button>
        <img id="modalImg" src="" alt="Expanded View">
        <div class="modal-caption" id="modalCaption"></div>
        <button class="nav-btn next-btn" onclick="changeSlide(1)">❯</button>
    </div>
</div>

<button class="admin-trigger" onclick="showAdminPanel()"><i class="fa-solid fa-lock"></i> Admin Login</button>

<script>
    // Navigation Toggle
    function toggleMobileMenu() {
        var menu = document.getElementById("navMenu");
        var icon = document.getElementById("menuIcon");
        menu.classList.toggle("show");
        
        if (menu.classList.contains("show")) {
            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");
        } else {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        }
    }

    // Firebase Integration
    var firebaseConfig = {
        apiKey: "AIzaSyCUFnabuAwrDzdLKmuJdu8L3Ix-6RtmFYw",
        authDomain: "my-favorite-afd36.firebaseapp.com",
        projectId: "my-favorite-afd36",
        storageBucket: "my-favorite-afd36.firebasestorage.app",
        messagingSenderId: "946815901030",
        appId: "1:946815901030:web:b36846c356f8f97edbfca7"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.firestore();

    var ADMIN_PASSWORD = "4858"; 
    var galleryData = [];
    var currentIndex = 0;
    var compressedBase64Image = "";

    // Image Compression Helper
    function processAndPreviewFile() {
        var file = document.getElementById('fileInput').files[0];
        var preview = document.getElementById('imgPreview');
        
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function (e) {
            var img = new Image();
            img.onload = function () {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');

                var maxWidth = 800;
                var scaleSize = maxWidth / img.width;
                
                if (scaleSize < 1) {
                    canvas.width = maxWidth;
                    canvas.height = img.height * scaleSize;
                } else {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                compressedBase64Image = canvas.toDataURL('image/jpeg', 0.7);
                
                preview.src = compressedBase64Image;
                preview.style.display = "block";
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Fetch Photos from Firestore
    function fetchPhotos() {
        var grid = document.getElementById("galleryGrid");
        grid.innerHTML = '<div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ছবি লোড হচ্ছে...</div>';
        
        db.collection("gallery").orderBy("createdAt", "desc").get().then(function(querySnapshot) {
            galleryData = [];
            querySnapshot.forEach(function(doc) {
                galleryData.push(doc.data());
            });
            displayGallery(galleryData);
        }).catch(function(error) {
            console.error("Error loading photos: ", error);
            grid.innerHTML = '<div class="loading-text">ছবি লোড করতে সমস্যা হয়েছে!</div>';
        });
    }

    // Upload Form Submit
    document.getElementById("photoForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        if (!compressedBase64Image) {
            alert("দয়া করে একটি ছবি সিলেক্ট করুন!");
            return;
        }

        var saveBtn = document.getElementById("saveBtn");
        saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> আপলোড হচ্ছে...';
        saveBtn.disabled = true;

        db.collection("gallery").add({
            url: compressedBase64Image,
            caption: document.getElementById("photoCaption").value.trim(),
            createdAt: new Date().getTime()
        }).then(function() {
            alert("ছবি সফলভাবে আপলোড হয়েছে!");
            document.getElementById("photoForm").reset();
            document.getElementById("imgPreview").style.display = "none";
            compressedBase64Image = "";
            fetchPhotos();
        }).catch(function(error) {
            alert("Error: " + error.message);
        }).finally(function() {
            saveBtn.innerHTML = '<i class="fa-solid fa-upload"></i> সেভ ও আপলোড করুন';
            saveBtn.disabled = false;
        });
    });

    // Display Gallery
    function displayGallery(items) {
        var grid = document.getElementById("galleryGrid");
        grid.innerHTML = "";

        if(!items || items.length === 0) {
            grid.innerHTML = '<div class="loading-text">গ্যালারিতে কোনো ছবি নেই। অ্যাডমিন থেকে ছবি যুক্ত করুন।</div>';
            return;
        }

        items.forEach(function(item, index) {
            var card = document.createElement("div");
            card.className = "gallery-card";
            card.onclick = function() { openModal(index); };
            
            card.innerHTML = '<div class="gallery-card-media"><img src="' + item.url + '" alt="Gallery Image"></div>' +
                            '<div class="caption">' + item.caption + '</div>';
            
            grid.appendChild(card);
        });
    }

    // Lightbox Controls
    function openModal(index) {
        currentIndex = index;
        updateModalContent();
        document.getElementById("imageModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("imageModal").style.display = "none";
    }

    function changeSlide(direction) {
        currentIndex += direction;
        if (currentIndex < 0) {
            currentIndex = galleryData.length - 1;
        } else if (currentIndex >= galleryData.length) {
            currentIndex = 0;
        }
        updateModalContent();
    }

    function updateModalContent() {
        var item = galleryData[currentIndex];
        document.getElementById("modalImg").src = item.url;
        document.getElementById("modalCaption").innerText = item.caption;
    }

    // Admin Controls
    function showAdminPanel() {
        var pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
        if (pass === ADMIN_PASSWORD) {
            document.getElementById("adminPanel").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (pass !== null) {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function hideAdminPanel() {
        document.getElementById("adminPanel").style.display = "none";
    }

    // Initial Load
    fetchPhotos();
</script>
</body>
</html>
